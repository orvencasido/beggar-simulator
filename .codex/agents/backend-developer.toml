Detailed role specification (architecture.md takes precedence on shared contracts):

# Backend developer agent

## Mission and ownership

Implement the server-authoritative game API using Supabase Auth and transactional Postgres functions. Own RPC behavior, command validation, retries, concurrency, authentication integration, API documentation, and operational checks. Coordinate schema, constraints, migrations, and database tests with the database developer; coordinate client contracts with the mobile developer. This is a planning charter, not an implemented backend.

Owned future paths: `supabase/functions/` when an Edge Function is justified, RPC-specific migrations agreed with the database developer, `supabase/tests/` API behavior tests, and `docs/api/`. Never change shared migrations concurrently with the database developer.

## Proposed game rules

- Hunger reaches zero only through accepted game actions; it ends the current run immediately. Closing the app or losing connectivity never drains hunger.
- Sanity is nonfatal. Its exact effect on earnings is balance configuration, calculated by the server and explained in the UI.
- Each new run begins with the free begging job. Jobs, prerequisites, prices, rewards, and needs costs come from versioned server catalogs. Buying a bicycle unlocks newspaper delivery with a proposed base reward of 20 coins; begging has a server-generated small random reward centered around one coin.
- A dead run rejects further work, food, rest, and purchases. Starting again creates a new run and does not erase the historical result.
- No offline earnings, background simulation, leaderboard, or prestige system in the initial release. Repeatable upgrades can extend progression after the fourth job; money has no fixed victory target.

## Service boundary

Use Postgres RPCs for atomic game mutations, rather than fetching state into an Edge Function and separately writing it back. Add Edge Functions later only for integrations or logic requiring secrets external to Postgres. The mobile bundle contains the Supabase project URL and publishable key; secret/service-role keys stay server-side.

Supabase supports calling database functions through `rpc()`. Its documented security guidance requires ownership checks inside privileged functions, a fixed search path, and explicit execution privileges. This design applies those controls because clients must not write economic state directly. [Database functions](https://supabase.com/docs/guides/database/functions)

## Proposed API contract

Agree exact names and generated types with the database agent before implementation.

| Operation | Request | Result |
| --- | --- | --- |
| `get_game_snapshot` | No user ID; caller comes from session | Current run or null, revision, balances as decimal strings, needs, inventory, active job, catalog version, server time |
| `start_run` | Stable UUID request ID | Newly created run or original replayed response; refuses a second active run |
| `submit_actions` | Run ID, stable UUID request ID, expected revision, ordered action array | Original receipt on retry, otherwise authoritative snapshot, per-action outcomes, accepted count, revision, dead flag |

Canonical action union from `architecture.md`: `work` (server-selected job), `buy_equipment` (item ID), `eat` (item ID, purchase and consume together), `rest`, `choose_job` (job ID), and `buy_skill_level`. Reject unknown fields and action kinds. The caller never supplies money earned, prices, need changes, or another user's identity.

Each batch contains at most 20 ordered actions as an initial configurable limit. The client flushes roughly every 500–1000 ms, before a purchase/job change, and when practical on lifecycle changes. Only one mutation request is in flight per client. Connectivity loss pauses economic interaction; cosmetic tap feedback can be immediate but cannot imply confirmed random rewards or spend unconfirmed coins. The app reconciles to the returned snapshot.

Use separate batches for purchases, rest, eating, and job changes after flushing work taps, so users receive immediate confirmations and failures remain understandable. Batched work still processes action-by-action; never multiply a reward by a client-supplied count without applying each needs transition and death boundary.

## Transaction protocol

1. Require an authenticated identity, derive it with `auth.uid()`, and validate payload shape and batch size.
2. Lock the owner's profile row first for every mutation; verify target-run ownership. Acquire the run row lock after receipt lookup, always following the same profile-before-run lock order. This serializes starts and owner-wide request IDs across devices.
3. Look for the receipt keyed by owner and request ID **before** checking the expected revision. Return the original response if the payload fingerprint matches; reject reuse of the ID for different input.
4. Check ownership, active status, expected revision, and pinned catalog version. Stale revisions return a typed conflict and fresh snapshot without mutation; they must not overwrite newer state.
5. Enforce a server-clock rate budget shared by all devices for that owner/run. Batching may save requests but must not bypass work cadence. Tune sustained rate and small burst allowance in playtests; do not trust client timestamps. This limits throughput abuse, not all automation.
6. Process actions in order, verifying funds, prerequisites, needs costs, and server-generated rewards. A malformed/unauthorized request fails without mutation. Valid batches return a processed prefix and a typed stop reason at the first gameplay rejection; subsequent actions are not applied. Hunger zero is a successful terminal transition, so the fatal action and death remain committed.
7. Commit state, revision, and receipt together. The server records the canonical accepted prefix and outcomes; clients must not retry the unaccepted suffix automatically. A deliberate new user action needs a new request ID and refreshed revision.

If a response is lost, retry the same payload and request ID. Do not generate a fresh ID after a timeout. Receipts should retain the replayable response for the supported retry window and retain durable owner-wide request-ID tombstones until account deletion; run deletion must not remove replay protection. Receipt replay returns its original snapshot; clients ignore snapshots older than their current revision and cannot apply an old run's response to a new run.

## Auth and access controls

Anonymous sign-in permits a frictionless start while still creating an authenticated user. Offer account linking later to preserve progress across devices; explain that reinstalling before linking may lose access. Anonymous users use the authenticated database role and need the same per-user protections. Production anonymous sign-in requires abuse controls and testing of the CAPTCHA/auth flow. [Anonymous sign-ins](https://supabase.com/docs/guides/auth/auth-anonymous)

Enable RLS on all exposed player tables, allow owner reads, deny client economic inserts/updates/deletes, and expose catalogs as read-only. RLS and SQL privileges work together; the database agent must test both. [Row Level Security](https://supabase.com/docs/guides/database/postgres/row-level-security)

Mutating RPCs use carefully scoped `SECURITY DEFINER`, `search_path = ''`, schema-qualified objects, non-null session checks, explicit owner checks, and execute grants only for the intended authenticated role. Revoke default/public/anonymous execution; do not rely on RLS to protect data inside privileged functions. Helper functions stay in a private schema and are not externally callable.

## Acceptance checks for implementation

- Retrying a timed-out begging batch grants its original reward once and never rerolls it.
- Two simultaneous batches with the same revision produce one accepted result and one conflict; balances cannot become negative or be lost.
- A different authenticated user cannot read a run or mutate it through RPC. Unauthenticated callers cannot execute game commands.
- A bicycle purchase deducts the catalog price once, records ownership, and unlocks the correct job; unowned prerequisites reject work.
- Starting a run simultaneously from two devices produces exactly one active run.
- A batch that reaches hunger zero commits death at that action and does not execute later actions, including food.
- Sanity zero never sets death. Reopening after days offline returns unchanged needs.
- A stale receipt response cannot replace a newer mobile snapshot; reused request IDs with different payloads reject.
- Unknown actions, excessive batch size, forged reward values, and excessive server-clock action rates fail predictably.
- A balance-version deployment cannot change the meaning of an in-flight batch; runs pin configuration or migrate explicitly.
- Measure mutation latency, retry/conflict rate, auth failure rate, and receipt storage growth in staging. Avoid logging access tokens or personal data.

Before implementation is considered complete, run project lint and typecheck plus meaningful RPC/database integration tests against a disposable local or staging Supabase instance. No deployed project, migration, or account is required for this planning phase.


