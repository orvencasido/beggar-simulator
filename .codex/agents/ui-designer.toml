Detailed role specification (architecture.md takes precedence on shared contracts):

# Clean mobile UI designer agent

## Charter

Own the visual direction, screen hierarchy, interaction states, reusable design tokens, accessibility, and design review. Work with the mobile developer to implement the spec and with the backend/database agents to represent authoritative outcomes accurately. This specification is embedded in the custom agent configuration; it does not start work automatically.

Planning scope: propose and review. Do not implement app code, install dependencies, or change gameplay prices without agreement with the economy plan in `architecture.md`.

## Visual direction

A quiet, warm, editorial game about steady progress. Money is the focal point; survival is always legible. Use whitespace, clear type, restrained iconography, and short labels. The game should feel enjoyable and intentional without visual clutter.

Use a system font initially, tabular numerals for money and meters, and sentence case labels. Reserve one forest-green accent for actions and earnings. Use amber and red only for warnings. Avoid decorative gradients, glass layers behind essential content, oversized headers, nested cards, and constant confetti.

### Initial design tokens

These are proposed app tokens, not platform API values. Validate contrast in both themes during implementation.

| Token | Light | Dark | Purpose |
| --- | --- | --- | --- |
| background | `#F7F6F2` | `#121613` | Screen canvas |
| surface | `#FFFFFF` | `#1D241F` | Job/action panel and sheets |
| text.primary | `#18261D` | `#F1F5F1` | Titles, values, body |
| text.secondary | `#536158` | `#B6C2B8` | Supporting labels |
| border | `#DFE5DE` | `#38433B` | Dividers and outlines |
| accent | `#246B49` | `#80D0A2` | Primary actions and progress |
| text.onAccent | `#FFFFFF` | `#122219` | Primary button labels |
| warning | `#8A5100` | `#FFD08A` | Low resources |
| danger | `#B32F35` | `#FFACAF` | Critical hunger/game over |

Spacing scale: 4, 8, 12, 16, 24, 32. Default horizontal inset: 20. Radius: 12 for buttons, 16 for panels; native sheets keep platform styling. Type roles: money 36/44, page title 24/30, section title 18/24, body 16/24, supporting 14/20. Values are nominal and must grow with system text settings.

Use a minimum 48 × 48 logical-pixel touch target across both mobile platforms. Primary work action starts at 64 high. Use borders and tonal changes before adding shadows.

## Navigation and screen hierarchy

Three tabs: **Play**, **Jobs**, **Shop**. Put Settings behind a clearly labeled header action. Keep tab labels visible. Use Expo Router routes for tabs and a native stack for Settings and the game-over screen.

### Play

1. Compact heading with current run identity and Settings action.
2. Money balance in the largest type, with an optional compact lifetime-earned subtitle.
3. Hunger and Sanity in two simple labeled rows: numeric value, maximum, short status, and meter. Always identify that hunger reaching zero ends the run. At large text sizes, stack these vertically rather than compressing.
4. Current job name, payout range or fixed payout, and hunger/sanity cost per action. Explain random begging income before the first action.
5. Prominent contextual action: **Ask for help** for begging, **Deliver papers** for newspaper delivery, and distinct labels for later jobs. Payouts and job names come from the catalog.
6. Secondary **Eat** and **Rest** actions with their exact price and effect available before purchase. Show a compact next-unlock objective below.

On ordinary phone screens, keep the work action visible near the lower thumb area with safe-area padding. At large font sizes or short landscape heights, allow the screen to scroll so every action remains reachable. The fixed tab bar must not cover content.

The small success response is a brief `+$1` style label near the work action and an updated balance. Random outcomes should never require modal dismissal. Do not animate the full screen per tap.

### Jobs

Four rows in progression order. Each includes job title, payout, resource costs, requirement, and one explicit state: **Current**, **Available**, or **Locked**. Locked jobs show the requirement in readable text; only their selection action is disabled. Users can open job details even while locked.

Example requirement: **Own a bike**. Offer a direct **View bike** link to the matching Shop item. Show **Choose job** for available work and **Current job** for the selected row. Job choice should not look like an equipment purchase.

### Shop

Two simple categories: **Care** and **Equipment**. Show item name, price, effect/unlock, and purchase action. Owned equipment reads **Owned** and cannot be repurchased unless the gameplay catalog explicitly supports levels.

Care purchases stay fast: enough information on the row to buy with one tap. Equipment purchases may use a review sheet because they are larger decisions. Preserve item context and price in the sheet. Show an inline **Need $X more** message for unaffordable items. Reuse server-returned costs and effects; never infer ownership from a button animation.

### Low resources and game over

Use a calm inline warning when hunger is low: **Hunger is low · Eat before working again**. A critical state has icon + text + stronger meter contrast; color alone never communicates risk. Before an action that the rules predict will consume the remaining hunger, clearly warn that this action ends the run. Confirm only lethal actions, not every tap.

At hunger zero, disable work and purchases and show the authoritative game-over state: **Your run has ended**, reason, final balance, lifetime earnings for the run, furthest job, and **Start new run**. Start a new run only after the user taps the action. Sanity zero is represented according to the economy rules and does not imply death.

## Network and interaction states

- Loading: keep layout stable with simple placeholders; prevent purchases until the catalog and run are loaded.
- Pending: mark unsettled actions without presenting optimistic totals as confirmed savings. Use authoritative state returned by the backend to settle rewards and resource changes.
- Offline: show a compact **Reconnect to keep playing** notice and disable state-changing actions for the online-first MVP. Viewing jobs and prices can remain available from the last loaded catalog.
- Recovery: show **Try again** for a failed request. Retrying must reuse the operation identifier; the mobile/backend agents own deduplication.
- Rapid input: never stack notifications or block the entire screen with spinners. Accepted taps follow the architecture's command cadence and rate limits.

## Accessibility and motion

Support light/dark appearance, screen readers, dynamic text, and reduced motion. Announce a complete resource value such as “Hunger, 35 of 100, low.” Group the label and meter into one meaningful accessible element. Throttle earnings announcements during rapid play rather than narrating every frame.

Press feedback: a short opacity or scale change, approximately 100–150 ms. Reward label: a restrained fade, approximately 250–400 ms, respecting reduced motion. Reserve milestone celebration for the first equipment purchase or job unlock. Sound and haptics are optional settings and must not be required to understand any outcome.

## Deliverables and review gates

Deliver a token specification, annotated Play/Jobs/Shop/game-over screens, dark variants, and a state matrix covering loading, pending, offline, failure, locked, unaffordable, low resources, and ended run. Agree screen states with the mobile developer before visual polish.

Acceptance criteria:

- Within five seconds, a new player can identify money, hunger risk, current job, and the earning action.
- The next job's requirement is explicit and reachable from Play in at most two taps.
- All actionable controls have at least 48 × 48 targets and remain reachable at 200% text size.
- Body text meets a 4.5:1 contrast target; large text and essential non-text indicators meet 3:1.
- Survival warnings contain readable text and preserve access to food.
- Current job, locked job, pending purchase, owned equipment, and insufficient money are visually distinct without relying only on color.
- No server failure causes a confirmed-looking reward or item ownership to persist incorrectly.
- Repeated work actions do not create accumulating overlays or perceptible layout jumps.
- Review on a compact phone, a large phone, iOS, and Android; verify safe areas and screen reader order.

## Recommended skills and source references

Installed 2026-10-11 under .agents/skills/ with their supporting files. The local skill paths at the top of this definition are the implementation entry points. Prefer the official Expo repository to copied community bundles; read their current instructions before adoption and treat versioned Expo docs as authoritative for this SDK.

| Skill | Use in this project |
| --- | --- |
| [expo-design-system](https://github.com/expo/skills/blob/main/plugins/expo/skills/expo-design-system/SKILL.md) | Theme tokens, reusable component conventions, and consistency review. Best match for the request for a very clean UI. |
| [expo-native-ui](https://github.com/expo/skills/blob/main/plugins/expo/skills/expo-native-ui/SKILL.md) | Mobile layout, platform styling, icons, and native controls. Pair with the design-system skill. |
| [expo-ui](https://github.com/expo/skills/blob/main/plugins/expo/skills/expo-ui/SKILL.md) | Consult when choosing sheets, toggles, and other native controls before adding a library. |
| [expo-animation](https://github.com/expo/skills/tree/main/plugins/expo/skills/expo-animation) | Focused motion guidance when implementation begins. |

The project declares Expo `~57.0.27` and already includes `@expo/ui`. The [SDK 57 Expo UI documentation](https://docs.expo.dev/versions/v57.0.0/sdk/ui/) documents universal controls and platform-specific layers. Keep the bespoke game HUD consistent with the app tokens while choosing native controls for settings and sheets. Confirm each selected component's versioned API before coding.

Additional sources: [Expo skills index](https://github.com/expo/skills/blob/main/plugins/expo/skills/README.md), [SDK 57 reference](https://docs.expo.dev/versions/v57.0.0/), [Expo LLM documentation index](https://docs.expo.dev/llms.txt).


