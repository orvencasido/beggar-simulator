Detailed role specification (architecture.md takes precedence on shared contracts):

# Database developer agent

## Mission and ownership

Own Supabase/Postgres schema, constraints, indexes, RLS, migration ordering, generated database types, and database integration tests. Coordinate transactional RPC migrations with the backend agent; only one agent edits a shared migration at a time. This document plans future work; it creates no tables or deployed resources.

Owned future paths: `supabase/migrations/`, `supabase/seed.sql`, `supabase/tests/`, schema documentation, and generated types delivered to the mobile agent. Use checked-in migrations rather than dashboard-only changes.

## Proposed schema

| Table | Purpose and principal constraints |
| --- | --- |
| `player_profiles` | One row per `auth.users` UUID; stable owner lock for all commands and run creation; lifetime gross earnings, completed runs and best run earnings updated transactionally. Bootstrap safely before acquiring the lock. |
| `catalog_versions` | Immutable published balance versions; initial version for four jobs. New runs use the current published version; existing runs keep their pinned version. |
| `job_definitions`, `item_definitions`, catalog rules | Versioned prices, reward bounds, need costs, prerequisite equipment, food recovery, sanity recovery, and upgrade scaling. Composite keys include catalog version and stable content ID. Published rows cannot be edited or deleted through client APIs. Prerequisites and rule constants may be normalized during schema implementation. |
| `game_runs` | UUID, owner, pinned catalog version, status, exact integer money and gross earnings, hunger, sanity, active job, skill level, revision, action count, timestamps. Preserve dead runs as history. MVP repeatable skill level lives on the run; no separate per-job upgrade table is needed. |
| `run_equipment` | Run-owned equipment, keyed by run and item ID; include catalog version and composite references so equipment cannot come from another version. Food is bought and immediately consumed by `eat`; no food inventory in MVP. Equipment and skill level reset on a new run. |
| `action_receipts` | Unique `(user_id, request_id)` across every run and command kind. Bind operation, run, canonical payload fingerprint, original response, and creation time. Preserve enough data to prevent expired retries from awarding again. |
| `command_rate_state` | Server-clock work rate budget per owner/run, updated transactionally; private to server functions. |

Use exact integer coins in PostgreSQL `numeric` with explicit nonnegative, integer, and finite-value checks; serialize every money field as a decimal **string** in RPC JSON. Do not assume PostgREST or JavaScript will preserve a large numeric JSON value. No fixed gameplay victory amount is required; numeric storage still has practical limits and upgrade arithmetic must fail safely before overflow.

Hunger and sanity are integers in `[0,100]`. An active run requires hunger greater than zero and no ended timestamp; a dead run requires hunger zero and an ended timestamp. Sanity zero is valid in either status. Revision and action counts are nonnegative; revisions increase only on accepted state changes. Store UTC timestamps. An active-job composite foreign key must match the run's catalog version; the RPC additionally checks its equipment prerequisites.

Catalog checks require nonnegative prices, valid reward bounds, nonnegative needs costs/recovery, and valid item kinds. Upgrade formulas must define rounding and safe growth bounds before implementation. Version publishing validation verifies all four initial jobs are reachable and that starting players can earn enough for food before hunger reaches zero.

## Indexes and integrity

- A partial unique index on `runs(user_id)` where status is active enforces at most one living run independently of RPC code. Add `(user_id, started_at DESC)` for history.
- Index owner foreign keys used by RLS; index run-owned table foreign keys and catalog prerequisite references used by work validation.
- Primary/unique indexes on catalogs and run equipment prevent duplicate purchases and mismatched version references. Run/history reads remain bounded and paginated.
- The receipt uniqueness key is owner-wide, not `(run_id, request_id)`: restarting must never make an old identifier available again. Bind `start_run` receipts to their created run too.
- Keep full receipts for a documented retry window. If responses are compacted, retain owner/request/payload tombstones until account deletion and return `receipt_expired`, never execute again. Run-history cleanup must not cascade-delete those tombstones. Account deletion may remove all associated data deliberately.

PostgreSQL row locks serialize competing writers until transaction end, while a partial unique index can enforce uniqueness on active rows. These are complementary controls. [Explicit locking](https://www.postgresql.org/docs/current/explicit-locking.html), [Partial indexes](https://www.postgresql.org/docs/current/indexes-partial.html)

## Transaction contract with backend

All commands derive identity from the authenticated session. Use one consistent lock order: owner/profile first, then owned run, then dependent state. Owner locking also serializes cross-run receipts and lifetime summaries. `start_run` safely creates/locks the owner row, checks its receipt first, refuses another active run, and creates a fresh run plus receipt atomically; the partial index remains a final guard.

For `submit_actions`, validate shape and authorization, lock state, then check the owner-wide receipt **before** revision or dead-status rejection. An exact replay returns its original response, even if the run has since died or a new run exists. Reusing its ID with another operation, run, or payload rejects. Check expected revision only for new requests.

The function validates the whole request's structural shape before mutation. It processes valid actions in order against locked state and pinned catalogs. A gameplay rejection stops at that action and commits the already accepted prefix; hunger zero commits the fatal action and stops immediately. No later food action can resurrect that run. Record outcomes, accepted count, stop reason, post-state revision, summary changes, and receipt in the same transaction. A SQL exception rolls back the transaction; gameplay stop conditions must be returned as data when a prefix should remain committed.

Random begging rewards are generated once by the server for each accepted action and included in its receipt. Work, purchases, food, and rest never trust supplied rewards, prices, or balances. Hunger changes only through accepted actions; no elapsed-time job or offline payout process exists. Follow the backend charter for rate limits, typed conflicts, batch limits, and client reconciliation.

## Access policy

Enable RLS on every exposed table. Authenticated users may read their own profile, summary, runs, and run-owned data; child policies verify the owning run. Grant read-only access to published catalogs. Deny direct client inserts, updates, and deletes for economic data. Keep receipts, rate state, and helper functions in an unexposed private schema; return sanitized receipt results through RPC.

Mutating RPCs need narrow `SECURITY DEFINER` authority because clients cannot write state directly. Set an empty search path, qualify every object, derive a non-null `auth.uid()`, and explicitly verify ownership. Revoke default `PUBLIC` and `anon` execution; grant only intended authenticated entry points. Privileged functions must not depend on RLS alone for authorization. Read functions should use invoker security where suitable. RLS and grants are separate controls and both require negative tests. [Database functions](https://supabase.com/docs/guides/database/functions), [Row Level Security](https://supabase.com/docs/guides/database/postgres/row-level-security)

## Migration and verification plan

1. Create private/public schemas, owner bootstrap, catalogs, player tables, foreign keys, checks, and indexes.
2. Seed and validate the first immutable catalog version; use synthetic fixture users only in disposable test environments.
3. Add RLS and grants, then backend-reviewed RPCs and private helpers. Regenerate client database types after each API/schema change.
4. Rebuild a disposable local database from migrations and seed; run functional and RLS tests. Promote the reviewed migration sequence to staging before production. Do not edit already applied migrations; add corrective migrations.
5. Future balance changes publish a new version. Existing run migration, if needed, requires an explicit reviewed conversion transaction and compatibility policy.

Required tests: two-user read isolation; unauthenticated denial; direct economic writes denied; one active run during concurrent starts; concurrent command revision conflict; duplicate retry pays once with identical random result; cross-run request-ID reuse rejects; dead-run receipt replays; receipt expiration cannot pay again; insufficient funds stop at the correct prefix; fatal action commits and skips remaining actions; sanity zero remains nonfatal; mismatched catalog references reject; exact large money strings survive serialization; summary totals agree with accepted rewards.

Migration replay and database checks accompany project lint/typecheck before future implementation is complete. Supabase's migration workflow keeps schema evolution reproducible. [Database migrations](https://supabase.com/docs/guides/local-development/database-migrations)


