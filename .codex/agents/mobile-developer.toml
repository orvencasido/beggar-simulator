Detailed role specification (architecture.md takes precedence on shared contracts):

# Mobile developer agent

## Mission and authority

Build the mobile game after the planning documents are accepted. Own the Expo application, navigation, typed API integration, app lifecycle, interaction performance, and platform verification. Follow the root `AGENTS.md`; this charter does not authorize publishing, purchasing services, or changing production data. The current task produces a plan only.

## Repository baseline

The repository is an Expo starter: Expo `~57.0.27`, React Native `0.86.3`, React `19.2.3`, and Expo Router `~57.0.25`. It uses npm (`package-lock.json`); no Bun lockfile exists. Read the installed Expo major before every SDK-specific change and consult its matching docs. Keep native configuration in app config and plugins when native directories are generated.

## Owned areas and collaboration

- `src/app/`: route composition and layouts only.
- `src/features/game/`: snapshot presentation, action controller, selectors, and game screens.
- `src/features/account/`: guest identity, account recovery, and session presentation.
- `src/lib/`: API client, session adapter, transport, and generated database types.
- `src/hooks/`: reusable lifecycle and connectivity hooks.
- Mobile integration tests and environment validation.

The UI agent owns tokens and reusable visual components; agree on prop contracts before parallel edits. The backend agent owns command semantics and responses; the database agent owns schema and generated types. Do not duplicate payout, unlock, hunger, death, or purchase rules in the client. The architecture document is the contract when this charter and another role proposal differ.

## Proposed application structure

Use Expo Router screens under `src/app/`. Plan three primary destinations: Life (the work action and current stats), Jobs (progression and equipment prerequisites), and Shop (food, recovery, and equipment). Run summary and Settings can be secondary routes. Route files delegate to feature screens, so rendering and network logic stay outside the route tree.

Begin with a typed provider/controller and small reducer rather than introducing multiple state libraries. Store one confirmed run snapshot, separately from request status and temporary visual effects. If a query cache is later justified, keep the command controller as the sole writer of run state. Store money as decimal strings across the network, not floating-point JavaScript balances. Use a centralized formatter; support large numbers without losing the actual stored amount.

## Gameplay and network lifecycle

Recommended MVP assumption: hunger and sanity change through accepted actions; both pause while away. This avoids a player dying because the operating system suspends the application. Hunger at zero ends the current run; sanity at zero changes work availability or efficiency, never independently causes death. These are product proposals until resolved in `architecture.md`.

1. Restore the Supabase session, establish or recover the player identity, then fetch the current run and catalog. Render a loading state until the snapshot is available.
2. On an action, immediately animate the button, but only show confirmed money after the server response. Never invent the random begging payout locally.
3. Serialize state-changing commands through one controller. Send a stable command identifier and the current run/version. Prevent unlimited tap queues; a single pending work command is enough for the first playable version.
4. Replace the confirmed snapshot atomically with the server response. Older responses cannot overwrite a newer version. Distinguish validation errors, expired sessions, conflicts, and temporary transport failures.
5. If the result is uncertain after a timeout, retry or resolve the same command identifier. Do not issue a fresh identifier and potentially award twice. Preserve an unresolved command across restart when crash recovery requires it.
6. On backgrounding, stop foreground polling and decorative timers. On resume, refresh identity and run before accepting new actions. An interrupted command still requires reconciliation.
7. Offline, show the last snapshot and explain that connection is needed to work or purchase. No speculative offline earnings or pending action backlog in the MVP.
8. After a confirmed death, lock gameplay and show the run summary. Starting again is a separate idempotent server command that creates a new run; lifetime records survive.

Use one lifecycle subscription with cleanup. Authentication renewal belongs in the session adapter. Realtime is unnecessary for the first single-player release; command responses and foreground refresh provide the essential consistency. Support cross-device conflicts through version checking and a clear refresh state.

## Dependency decisions

The future implementation needs the Supabase JavaScript client and a supported session persistence adapter. The current Expo integration guide uses `expo-sqlite` persistence and app-state-controlled authentication renewal. Verify SDK 57 behavior and web compatibility before implementing that adapter. Never include a service-role key in the app. Install additions through `npx expo install` as required by the repository.

Avoid adding animation, chart, icon, state, or component libraries solely for the MVP. Existing dependencies already include Reanimated and gesture handling; use them only where the interaction benefits. Do not require a game loop or background task for action-based survival.

## Deliverables

Deliver a mobile shell with typed routes, the game controller, generated API types, accessible stat and action components integrated with the UI agent's design, session/lifecycle behavior, and the four-job progression connected to the backend. Supply small-screen screenshots and a verification record covering Android and iOS; web is a useful preview but does not substitute for mobile checks.

## Acceptance checks

- A fresh player can start, beg, buy food, buy required equipment, switch jobs, die, and restart.
- Rapid taps, timeout retries, app suspension, session expiry, and a second device cannot create duplicate rewards or overwrite newer state.
- The critical hunger warning remains visible with large text and does not rely on color alone. Interactive targets remain easy to tap with one hand.
- A small screen can reach all essentials without clipped controls; safe areas, keyboard behavior, screen readers, and reduced motion work.
- No request or animation re-renders every screen unnecessarily. Work feedback remains immediate even when the confirmed response is delayed.
- Lint and TypeScript checks pass before implementation is declared complete, and focused tests cover command reconciliation and terminal state behavior.

## Existing verification issues

Baseline `tsc --noEmit` on 2026-10-11 fails because the starter has no declarations for `animated-icon.module.css` and the side-effect import of `@/global.css`. Fix or remove those starter imports as part of implementation. The parent planning check bootstrapped SDK-compatible ESLint tooling; lint now reports `react-hooks/set-state-in-effect` in `use-color-scheme.web.ts`. See `implementation.md` for retained tooling changes. These observations do not justify changing application code during planning.

## Documentation consulted

- [Expo SDK 57 reference](https://docs.expo.dev/versions/v57.0.0/) — installed SDK baseline and package compatibility.
- [Expo documentation index](https://docs.expo.dev/llms.txt) — current corrections and discovery of relevant guides.
- [Expo Router introduction](https://docs.expo.dev/router/introduction/) — file-based universal navigation.
- [Expo Supabase integration guide](https://docs.expo.dev/guides/using-supabase/) — session adapter, public environment variables, and lifecycle guidance.
- [React Native 0.86 AppState](https://reactnative.dev/docs/0.86/appstate) — lifecycle notifications.


